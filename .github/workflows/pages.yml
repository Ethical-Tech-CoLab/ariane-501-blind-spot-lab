name: Research website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "data/**"
      - "results/**"
      - "tools/audit_mariupol.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "data/**"
      - "results/**"
      - "tools/audit_mariupol.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - name: Reproduce pinned Mariupol source audit
        run: node tools/audit_mariupol.mjs --check
      - run: npm run build --prefix site
      - run: npm test --prefix site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static research site
        id: deployment
        uses: actions/deploy-pages@v4
