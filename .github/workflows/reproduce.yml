name: Reproduce the study

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests and artifact contracts
        run: python -m unittest discover -s tests -v
      - name: Reproduce all generated results
        run: python -m blind_spot.run --check
      - name: Execute the narrative notebook
        run: python tools/execute_notebook.py --check
